name: Deploy Admin (Vue SPA)

on:
  push:
    branches: [main, feature/astro-migration]
    paths:
      - 'blog-front/blog-admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blog-front/blog-admin/package-lock.json

      - name: Install dependencies
        working-directory: blog-front/blog-admin
        run: npm install

      - name: Build
        working-directory: blog-front/blog-admin
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: blog-front/blog-admin/dist
