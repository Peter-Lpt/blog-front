<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 墨蓝圆角底，呼应夜航观测站视觉 -->
  <rect width="64" height="64" rx="16" fill="#101820"/>

  <!-- 低对比度坐标刻度线 -->
  <g stroke="#76a9b8" stroke-width="1" opacity="0.12">
    <line x1="16" y1="32" x2="48" y2="32"/>
    <line x1="32" y1="16" x2="32" y2="48"/>
  </g>

  <!-- 信号橙细环，呼应 Header logo 圆点光晕 -->
  <circle cx="32" cy="32" r="20.5" fill="none" stroke="#e49b52" stroke-width="1.6" opacity="0.4"/>

  <!-- 观测坐标四芒星，信号橙 -->
  <path d="M32 9 C34.2 26.5 37.2 29.8 55 32 C37.2 34.2 34.2 37.5 32 55 C29.8 37.5 26.8 34.2 9 32 C26.8 29.8 29.8 26.5 32 9 Z" fill="#e49b52"/>

  <!-- 中心高光 -->
  <circle cx="25.5" cy="19.5" r="2.6" fill="#ffffff" opacity="0.55"/>
</svg>
